name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    # Keep Python 3.9 available; ubuntu-latest no longer provides a compatible build.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m unittest discover -s tests -v
      - run: python checker.py --listing examples/listing.json --keywords examples/keywords.json --dry-run
